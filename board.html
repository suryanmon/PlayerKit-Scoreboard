<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&display=swap');
  /* All sizes use vw so the card scales with the browser source width (sharp at 1080x1920). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Exo 2', 'Arial Black', Arial, sans-serif; }
  .score-card {
    position: fixed; right: 4vw; bottom: 4vw;
    background: #19252b; color: #fff; border-radius: 2.5vw; border-bottom: 0.8vw solid #333;
    box-shadow: 0 1vw 3.5vw rgba(0,0,0,0.55); padding: 2.2vw 4.5vw 2.6vw; min-width: 38vw; text-align: left;
  }
  .team { font-size: 4.4vw; font-weight: 700; text-transform: uppercase; letter-spacing: .15vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
  .line { display: flex; align-items: baseline; gap: 2.5vw; }
  .score { display: inline-flex; align-items: center; gap: 2vw; font-size: 12vw; font-weight: 800; color: #ffeb3b; line-height: 1.1; font-variant-numeric: lining-nums; font-synthesis: none; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
  .sep { display: inline-block; width: 3.8vw; height: 1.6vw; border-radius: 0.5vw; background: #ffeb3b; }
  .overs { font-size: 4.8vw; color: #aaa; font-weight: 500; }
  #dot { display: inline-block; width: 1.6vw; height: 1.6vw; border-radius: 50%; background: #4caf50; opacity: .25; vertical-align: middle; }
</style>
</head>
<body>
<div class="score-card">
  <div class="team"><span id="team">MATCH</span> <span id="dot"></span></div>
  <div class="line">
    <span class="score"><span id="runs">0</span><span class="sep"></span><span id="wkts">0</span></span>
    <span class="overs" id="overs">(0.0)</span>
  </div>
</div>

<script>
  const TOPIC = 'edwydenny-cricket-7k3q9x2m4p';   // must match admin.html
  const SSE_URL = 'https://ntfy.sh/' + TOPIC + '/sse?since=all';
  const $ = id => document.getElementById(id);
  let tick = false;

  function render(d) {
    const bat = d.battingSide || 'team1';
    $('team').textContent = bat === 'team1' ? (d.team1Name || 'TEAM 1') : (d.team2Name || 'TEAM 2');
    const sp = String(d.score || '0-0').split('-');
    $('runs').textContent = sp[0] || '0';
    $('wkts').textContent = sp[1] || '0';
    $('overs').textContent = '(' + (d.overs || '0.0') + ')';
    tick = !tick;
    $('dot').style.opacity = tick ? '1' : '0.25';
  }

  const es = new EventSource(SSE_URL);   // auto-reconnects on its own
  es.onopen = () => { $('dot').style.background = '#4caf50'; };
  es.onerror = () => { $('dot').style.background = '#ff5252'; };
  es.onmessage = e => {
    try { const m = JSON.parse(e.data); if (m.event === 'message') render(JSON.parse(m.message)); } catch (err) {}
  };
</script>
</body>
</html>
