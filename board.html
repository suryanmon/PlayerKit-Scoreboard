<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&display=swap');
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Exo 2', sans-serif; }
  .score-card {
    position: fixed; right: 30px; bottom: 30px; display: block;
    background: #19252b; color: #fff; border-radius: 10px; border-bottom: 3px solid #333;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55); padding: 8px 16px; min-width: 150px; text-align: left;
  }
  .team { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .line { display: flex; align-items: baseline; gap: 8px; }
  .score { font-size: 38px; font-weight: 800; color: #ffeb3b; line-height: 1.05; }
  .overs { font-size: 16px; color: #aaa; font-weight: 500; }
</style>
</head>
<body>
<div class="score-card" id="card">
  <div class="team"><span id="team">MATCH</span> <span id="dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4caf50;opacity:.25;vertical-align:middle;"></span></div>
  <div class="line">
    <span class="score" id="score">0-0</span>
    <span class="overs" id="overs">(0.0)</span>
  </div>
</div>

<script>
  const TOPIC = 'edwydenny-cricket-7k3q9x2m4p';   // must match admin.html
  const SSE_URL = 'https://ntfy.sh/' + TOPIC + '/sse?since=all';
  let tick = false;

  function render(d) {
    const bat = d.battingSide || 'team1';
    document.getElementById('team').innerText = bat === 'team1' ? (d.team1Name || 'TEAM 1') : (d.team2Name || 'TEAM 2');
    document.getElementById('score').innerText = d.score || '0-0';
    document.getElementById('overs').innerText = '(' + (d.overs || '0.0') + ')';
    tick = !tick;
    document.getElementById('dot').style.opacity = tick ? '1' : '0.25';
  }

  function connect() {
    const es = new EventSource(SSE_URL);
    es.onopen = () => { document.getElementById('dot').style.background = '#4caf50'; };
    es.onmessage = e => {
      try { const m = JSON.parse(e.data); if (m.event === 'message') render(JSON.parse(m.message)); } catch (err) { console.log(err); }
    };
    es.onerror = () => { document.getElementById('dot').style.background = '#ff5252'; };  // tiny red dot only; auto-reconnects
  }
  connect();
</script>
</body>
</html>
