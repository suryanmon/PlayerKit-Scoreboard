<!DOCTYPE html>
<html>
<head>
<title>2v2 Tap Scorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  body { font-family: sans-serif; background:#121212; color:#fff; margin:0; padding:12px; max-width:500px; margin:auto; -webkit-user-select:none; user-select:none; }
  .card { background:#1e1e1e; border:1px solid #333; border-radius:12px; padding:12px; margin-bottom:10px; }
  label.t { font-size:10px; font-weight:bold; color:#888; text-transform:uppercase; display:block; margin-bottom:4px; }
  .big { text-align:center; font-size:44px; font-weight:800; line-height:1; }
  .sub { text-align:center; color:#aaa; font-size:13px; margin-top:6px; }
  .chips { display:flex; gap:6px; margin-bottom:8px; }
  .chip { flex:1; padding:12px 4px; text-align:center; background:#333; border-radius:8px; font-size:13px; font-weight:bold; color:#aaa; }
  .chip.on { background:#00acee; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .b { padding:20px 0; font-size:22px; font-weight:800; border:none; border-radius:10px; background:#2c2c2c; color:#fff; }
  .b:active { transform:scale(.95); }
  .b.four { background:#2e7d32; } .b.six { background:#6a1b9a; } .b.w { background:#c62828; } .b.x { background:#ef6c00; font-size:16px; }
  .b.u { background:#455a64; font-size:16px; }
  input[type=text], input[type=number] { background:#2c2c2c; color:#fff; border:1px solid #444; width:100%; padding:10px; border-radius:6px; box-sizing:border-box; }
  input[type=color] { border:none; width:44px; height:36px; background:transparent; }
  .row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .wide { width:100%; padding:14px; border:none; border-radius:8px; font-weight:bold; font-size:14px; color:#fff; margin-top:6px; }
  details summary { cursor:pointer; font-weight:bold; font-size:13px; color:#888; }
</style>
</head>
<body>

<div class="card">
  <div class="big" id="liveScore">0-0</div>
  <div class="sub"><span id="liveOvers">0.0</span> / 4 ov &nbsp;|&nbsp; <span id="liveInfo"></span></div>
</div>

<div class="card">
  <label class="t">Striker (batting team)</label>
  <div class="chips" id="strikerChips"></div>
  <label class="t">Bowler (fielding team)</label>
  <div class="chips" id="bowlerChips"></div>
</div>

<div class="grid">
  <button class="b" onclick="ball(0)">0</button>
  <button class="b" onclick="ball(1)">1</button>
  <button class="b" onclick="ball(2)">2</button>
  <button class="b" onclick="ball(3)">3</button>
  <button class="b four" onclick="ball(4)">4</button>
  <button class="b six" onclick="ball(6)">6</button>
  <button class="b w" onclick="wicket()">OUT</button>
  <button class="b x" onclick="extra()">WD/NB</button>
</div>
<div class="row" style="margin-top:8px;">
  <button class="b u" style="flex:1" onclick="undo()">UNDO</button>
  <button class="b u" style="flex:1" onclick="swapStriker()">SWAP</button>
</div>

<button class="wide" id="voiceBtn" style="background:#6a1b9a" onclick="toggleVoice()">VOICE SCORING: OFF</button>
<div id="heard" style="text-align:center;font-size:12px;color:#aaa;margin-top:6px;">Say: dot, one, two, three, four, six, out, wide, undo</div>

<button class="wide" style="background:#00acee" onclick="nextInnings()">END INNINGS / START 2ND</button>
<button class="wide" style="background:#d32f2f" onclick="resetBoard()">RESET SCORES</button>
<div id="status" style="text-align:center;margin:10px 0;font-size:12px;color:#888;">Loading...</div>

<details class="card">
  <summary>Names and colors</summary>
  <div style="margin-top:10px">
    <div class="row"><input type="text" id="team1Name" placeholder="Team 1 name" onchange="saveNames()"><input type="color" id="color1" value="#0277bd" onchange="saveNames()"></div>
    <div class="row"><input type="text" id="p1Name" placeholder="P1" onchange="saveNames()"><input type="text" id="p2Name" placeholder="P2" onchange="saveNames()"></div>
    <div class="row"><input type="text" id="team2Name" placeholder="Team 2 name" onchange="saveNames()"><input type="color" id="color2" value="#c62828" onchange="saveNames()"></div>
    <div class="row"><input type="text" id="p3Name" placeholder="P3" onchange="saveNames()"><input type="text" id="p4Name" placeholder="P4" onchange="saveNames()"></div>
  </div>
</details>

<script>
  // Paste your own values here (rotate the old key first)
  const BIN_ID = '6937d64fae596e708f8d16a9';
  const API_KEY = '$2a$10$/hLwjwFuLAmOdHLdMG64ZeTBqP43JSwO3KQh/NZRjzu6hNtpCTAO6';

  const MAX_BALLS = 24;           // 4 overs x 6
  const ids = ['team1Name','team2Name','color1','color2','score','overs','target','oppScore',
               'p1Name','p1Runs','p1Wkts','p2Name','p2Runs','p2Wkts','p3Name','p3Runs','p3Wkts','p4Name','p4Runs','p4Wkts'];

  // Internal state
  let S = { bat:'team1', runs:0, wkts:0, balls:0, striker:1, bowler:3, innings:1, target:0, oppScore:'',
            pr:{1:0,2:0,3:0,4:0}, pw:{1:0,2:0,3:0,4:0} };
  let names = {};
  let history = [];
  let pushTimer = null;

  const batPlayers = () => S.bat === 'team1' ? [1,2] : [3,4];
  const fieldPlayers = () => S.bat === 'team1' ? [3,4] : [1,2];
  const pname = n => (document.getElementById('p'+n+'Name').value || 'P'+n);

  function snap() { history.push(JSON.stringify(S)); if (history.length > 60) history.shift(); }
  function undo() { if (!history.length) return; S = JSON.parse(history.pop()); render(); push(); }

  function ballsDone() { return S.balls >= MAX_BALLS; }
  function overs() { return Math.floor(S.balls/6) + '.' + (S.balls % 6); }

  function ball(r) {
    if (ballsDone()) return alert('Innings over. Start 2nd innings.');
    snap();
    S.runs += r; S.pr[S.striker] += r; S.balls++;
    if (r % 2 === 1) swapStrikerQuiet();
    if (S.balls % 6 === 0) swapStrikerQuiet(); // end of over
    render(); push();
  }
  function wicket() {
    if (ballsDone()) return;
    snap();
    S.wkts++; S.pw[S.bowler]++; S.balls++;
    if (S.balls % 6 === 0) swapStrikerQuiet();
    render(); push();
  }
  function extra() { snap(); S.runs += 1; render(); push(); }  // wide / no ball: run added, ball not counted
  function swapStrikerQuiet() { const p = batPlayers(); S.striker = (S.striker === p[0]) ? p[1] : p[0]; }
  function swapStriker() { snap(); swapStrikerQuiet(); render(); push(); }

  function nextInnings() {
    if (!confirm('End this innings and start the next one?')) return;
    snap();
    const tn = S.bat === 'team1' ? (val('team1Name') || 'TEAM 1') : (val('team2Name') || 'TEAM 2');
    S.oppScore = tn + ' ' + S.runs + '-' + S.wkts;
    S.target = S.runs + 1;
    S.bat = S.bat === 'team1' ? 'team2' : 'team1';
    S.runs = 0; S.wkts = 0; S.balls = 0; S.innings = 2;
    S.striker = batPlayers()[0]; S.bowler = fieldPlayers()[0];
    render(); push();
  }
  function resetBoard() {
    if (!confirm('Reset all scores? Names are kept.')) return;
    snap();
    S = { bat:'team1', runs:0, wkts:0, balls:0, striker:1, bowler:3, innings:1, target:0, oppScore:'', pr:{1:0,2:0,3:0,4:0}, pw:{1:0,2:0,3:0,4:0} };
    render(); push();
  }

  function val(id) { return document.getElementById(id).value; }
  function pick(kind, n) { snap(); if (kind==='s') S.striker = n; else S.bowler = n; render(); push(); }

  function render() {
    document.getElementById('liveScore').innerText = S.runs + '-' + S.wkts;
    document.getElementById('liveOvers').innerText = overs();
    let info = 'Innings ' + S.innings;
    if (S.target) info += ' | Need ' + Math.max(S.target - S.runs, 0) + ' from ' + (MAX_BALLS - S.balls) + ' balls';
    document.getElementById('liveInfo').innerText = info;
    document.getElementById('strikerChips').innerHTML = batPlayers().map(n =>
      `<div class="chip ${S.striker===n?'on':''}" onclick="pick('s',${n})">${pname(n)} (${S.pr[n]})</div>`).join('');
    document.getElementById('bowlerChips').innerHTML = fieldPlayers().map(n =>
      `<div class="chip ${S.bowler===n?'on':''}" onclick="pick('b',${n})">${pname(n)} (${S.pw[n]} wkt)</div>`).join('');
  }

  // Build the same JSON your overlay already reads
  function payload() {
    const d = {};
    ids.forEach(id => d[id] = val(id));
    d.score = S.runs + '-' + S.wkts;
    d.overs = overs();
    d.target = S.target ? String(S.target) : '';
    d.oppScore = S.oppScore;
    [1,2,3,4].forEach(n => { d['p'+n+'Runs'] = String(S.pr[n]); d['p'+n+'Wkts'] = String(S.pw[n]); });
    d.battingSide = S.bat;
    return d;
  }
  let inflight = false, dirty = false;
  function push() {
    try { localStorage.setItem('tapState', JSON.stringify(S)); } catch (e) {}   // resume after reload
    document.getElementById('status').innerText = 'Updating...';
    clearTimeout(pushTimer);
    pushTimer = setTimeout(send, 300);
  }
  async function send() {
    if (inflight) { dirty = true; return; }       // one request at a time
    inflight = true; dirty = false;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 10000);
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify(payload())
      });
      let msg = '';
      if (!r.ok) { try { msg = (await r.json()).message || ''; } catch (e) {} }
      document.getElementById('status').innerText = r.ok ? 'Live updated' : 'Update failed (HTTP ' + r.status + ') ' + msg;
    } catch (e) {
      document.getElementById('status').innerText = e.name === 'AbortError' ? 'Timed out, check internet' : 'Error: ' + e.message;
    }
    clearTimeout(to);
    inflight = false;
    if (dirty) send();                            // send the newest score if taps came in meanwhile
  }
  function saveNames() { render(); push(); }

  // ---- Voice scoring (Safari on iPhone, Chrome on Android; needs internet and mic permission) ----
  let rec = null, voiceOn = false;
  const WORDS = {
    dot:'0', zero:'0', nothing:'0', one:'1', single:'1', won:'1', two:'2', double:'2', three:'3',
    four:'4', boundary:'4', six:'6', sixer:'6', out:'W', wicket:'W', bowled:'W', wide:'X', noball:'X', undo:'U', cancel:'U'
  };
  function handleVoice(text) {
    const words = text.toLowerCase().replace('no ball','noball').split(/[^a-z]+/);
    for (const w of words) {
      const k = WORDS[w];
      if (!k) continue;
      document.getElementById('heard').innerText = 'Heard: "' + w + '"';
      if (k === 'W') wicket(); else if (k === 'X') extra(); else if (k === 'U') undo(); else ball(parseInt(k, 10));
      return;   // one action per phrase
    }
    document.getElementById('heard').innerText = 'Not understood: "' + text + '"';
  }
  function toggleVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return alert('Voice is not supported in this browser. Use Safari (iPhone) or Chrome (Android).');
    const btn = document.getElementById('voiceBtn');
    if (voiceOn) { voiceOn = false; rec.stop(); btn.innerText = 'VOICE SCORING: OFF'; return; }
    rec = new SR();
    rec.lang = 'en-IN'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) handleVoice(e.results[i][0].transcript); };
    rec.onend = () => { if (voiceOn) { try { rec.start(); } catch (e) {} } };   // keeps listening
    rec.onerror = e => { document.getElementById('heard').innerText = 'Mic error: ' + e.error; };
    voiceOn = true; rec.start(); btn.innerText = 'VOICE SCORING: ON (listening)';
  }

  // Load saved data
  fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':API_KEY}})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(j => {
      const d = j.record || {};
      ['team1Name','team2Name','color1','color2','p1Name','p2Name','p3Name','p4Name'].forEach(id => { if (d[id]) document.getElementById(id).value = d[id]; });
      try { const saved = localStorage.getItem('tapState'); if (saved) S = JSON.parse(saved); } catch (e) {}
      render();
      document.getElementById('status').innerText = 'Ready';
    }).catch(e => { render(); document.getElementById('status').innerText = 'Could not load (' + e.message + ')'; });
  render();
</script>
</body>
</html>
